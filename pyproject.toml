[project]
name = "docs-agent-lab"
version = "0.1.0"
description = "Mintlify-style ChromaFs replica over the LangChain docs, plus a LangChain docs agent for testing."
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb==1.5.9",
    "deepagents==0.7.25",
    "httpx>=0.27.0",
    "langchain==1.4.5",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openrouter==0.2.9",
    "langgraph==1.2.15",
    "langsmith==0.14.8",
    "python-dotenv>=1.0.1",
    "pyyaml==6.0.3",
    "requests>=2.32.0",
]

[dependency-groups]
dev = [
    "langgraph-api>=0.16.0",
    "langgraph-cli[inmem]>=0.4.34",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0",
]
